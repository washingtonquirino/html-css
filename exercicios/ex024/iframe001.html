<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>

    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>

    <!--Tamnho padrão de um iframe 300x150-->
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="1" height="500px" scolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">CEV</a>
        </iframe>
    </p>

    <p>
        Repositório
        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
    </p>

</body>
</html>
