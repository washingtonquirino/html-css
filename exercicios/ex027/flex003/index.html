<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
</head>
<style>
    div.container {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
    }

    div.item {
        background-color: lightblue;
        border: 1px solid black;
        text-align: center;
        padding: 10px;
        flex: auto;
    }
</style>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco Item A</div>
        <div class="item">Exemplo de bloco Item B</div>
        <div class="item">Exemplo de bloco Item C</div>
        <div class="item">Exemplo de bloco Item D</div>   
        <div class="item">Exemplo de bloco Item E</div>
        <div class="item">Exemplo de bloco Item F</div>
        <div class="item">Exemplo de bloco Item G</div>
        
    </div>
</body>
</html>
