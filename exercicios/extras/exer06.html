<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caixas</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            
        }

        section.caixas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            gap: 10px;
        }

        #box01{
            width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.721);
            
        }

        #box02{
            width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(235, 10, 10, 0.721);
        }
        #box03{
           width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(80, 190, 20, 0.721);
        }
        #box04{
            width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(13, 101, 152, 0.721);
        }
        #box05{
           width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(200, 169, 15, 0.721);
        }
        #box06{
            width: 80px;
            height: 80px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: rgba(3, 10, 205, 0.721);
        }

        #box07 {
            width: 80px;
            height: 80px;
            background-color: rgba(147, 9, 128, 0.721);
             border-radius: 10px;
            position: relative;
            /* nome-da-animacao duracao tempo-funcao repetição */
            animation: moverLateral 3s linear infinite alternate;
        }

        @keyframes moverLateral {
            from { left: -150px; }
            to { left: 150px; } /* Mova a caixa 300px para a direita */
        }

        #box08 {
            width: 80px;
            height: 80px;
            background-color: rgba(11, 80, 159, 0.721);
            border-radius: 10px;
            position: relative;
            animation: girar 2s linear infinite;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }



        #box01:hover {
            transform: translateX(100px);
            transition: 2s;
        }

        #box02:hover {
            transform: rotate(360deg);
            transition: 2s;
        }

        #box03:hover {
            transform: rotateX(360deg);
            transition: 2s;
        }

        #box04:hover {
            transform: rotateY(360deg);
            transition: 2s;
        }

        #box05:hover {
            transform: scaleX(1.5);
            transition: 2s;
        }

        #box06:hover {
           transform: scale(1.3);
            transition: 2s;
        }

       
    </style>
</head>
<body>
    <section class="caixas">
        <div id="box01"></div>
        <div id="box02"></div>
        <div id="box03"></div>
        <div id="box04"></div>
        <div id="box05"></div>
        <div id="box06"></div>
        <div id="box07"></div>
        <div id="box08"></div>
        
    </section>
</body>
</html>
