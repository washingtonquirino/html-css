<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parábola Lab - Jogo de Função Quadrática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Parábola Lab: Função Quadrática</h1>
      <div class="hud" aria-live="polite">
        <span>Nível: <strong id="level-display">1</strong></span>
        <span>Pontuação: <strong id="score-display">0</strong></span>
      </div>
    </header>

    <!-- Painel com conceitos teóricos -->
    <section class="card theory-card">
      <h2>Conceito do Nível</h2>
      <p id="level-description">
        Ajuste o parâmetro <strong>b</strong> (impulso inicial) para fazer a parábola cruzar a raiz exata onde o alvo está localizado.
      </p>
      <div class="equation-box">
        Equação: <span id="equation-display">y = -0.5x² + 5.0x + 0.0</span>
      </div>
    </section>

    <!-- Painel de Controles Acessível -->
    <section class="card controls-card">
      <h2>Controles da Parábola</h2>
      
      <div class="control-group">
        <label for="input-a">Coeficiente a (Concavidade): <span id="val-a">-0.5</span></label>
        <input type="range" id="input-a" min="-2" max="-0.1" step="0.1" value="-0.5">
      </div>

      <div class="control-group">
        <label for="input-b">Coeficiente b (Impulso): <span id="val-b">5.0</span></label>
        <input type="range" id="input-b" min="1" max="12" step="0.5" value="5.0">
      </div>

      <div class="control-group">
        <label for="input-c">Coeficiente c (Altura Inicial): <span id="val-c">0.0</span></label>
        <input type="range" id="input-c" min="0" max="5" step="0.5" value="0.0">
      </div>
    </button>
    </section>

    <!-- Área da Simulação -->
    <section class="canvas-container">
      <canvas id="gameCanvas" width="800" height="400" role="img" aria-label="Simulação de lançamento parabólico. Alvo visível na tela."></canvas>
      <div class="canvas-actions">
        <button id="btn-launch" class="btn btn-primary">Lançar Projétil</button>
      </div>
    </section>

    <!-- Feedback Acessível para Leitores de Tela -->
    <div id="feedback" class="feedback-box" role="status" aria-live="assertive"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
